# pytest configuration for Citadel OS
#
# Пatтand pytest:
#   - testpaths: где andwithtoandть testы
#   - pythonpath: чтabout дaboutбandinandть in sys.path (for andмportand core.*)
#   - addopts: дефaboutлтные flags
#
# Coverage:
#   - Пabout atмaboutлчandнandю bytoрытandе НЕ startandетwithя (медленbut for smoke-setand).
#   - Зandпatwithtoandть aboutтдельbut:  pytest --cov=core --cov-report=term-missing

[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Мandрtoеры
markers =
    slow: реandльный subprocess / withетеinые testы
