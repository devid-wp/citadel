# pytest configuration for Citadel OS
#
# Пути pytest:
#   - testpaths: где искать тесты
#   - pythonpath: что добавить в sys.path (для импорта core.*)
#   - addopts: дефолтные флаги
#
# Coverage:
#   - По умолчанию покрытие НЕ запускается (медленно для smoke-набора).
#   - Запускать отдельно:  pytest --cov=core --cov-report=term-missing

[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Маркеры
markers =
    slow: реальный subprocess / сетевые тесты
