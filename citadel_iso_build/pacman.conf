# Citadel OS — pacman.conf for mkarchiso build environment
# Mirrors configured for live build; will be replaced/extended on the Arch build host.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64

# Misc options
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
